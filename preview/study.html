<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>伴学面板 · 预览</title>
    <link rel="stylesheet" href="../plugin/study.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background:
          radial-gradient(circle at 18% 24%, rgba(96, 148, 255, 0.32), transparent 55%),
          radial-gradient(circle at 82% 70%, rgba(196, 124, 255, 0.24), transparent 52%),
          linear-gradient(160deg, #131a2b 0%, #0a0e18 55%, #05070d 100%);
        padding: 26px;
      }

      .card {
        max-width: 460px;
        margin: 0 auto;
        height: calc(100% - 52px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header class="card-head">
        <span class="badge">伴学</span>
        <span class="head-hint">离线分词 · 自动拆句</span>
      </header>

      <section class="block">
        <h3>原文</h3>
        <p class="sentence" id="sentence"></p>
      </section>

      <section class="block">
        <h3>句节</h3>
        <ul class="chunks" id="chunks"></ul>
      </section>

      <section class="block">
        <h3>单词</h3>
        <ul class="words" id="words"></ul>
      </section>

      <section class="block" id="notesBlock" hidden>
        <h3>语法点</h3>
        <ul class="notes" id="notes"></ul>
      </section>

      <section class="block" id="transBlock" hidden>
        <h3>参考译文</h3>
        <p class="translation" id="translation"></p>
      </section>
    </div>
    <script>
      fetch('study-demo.json')
        .then(response => response.json())
        .then(data => {
          window.psOrb = { onStudy: callback => callback(data) };
          const script = document.createElement('script');
          script.src = '../plugin/study.js';
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
