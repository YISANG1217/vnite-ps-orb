<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' attachment: data:; font-src 'self'" />
  <title>PlayStation 悬浮球</title>
  <link rel="stylesheet" href="orb.css" />
</head>
<body>
  <div id="app" class="ps-orb-root" data-accent="blue" data-side="left" data-anchor="bottom">
    <button class="orb" type="button" aria-label="PlayStation 悬浮球" title="点击展开最近游玩">
      <span class="orb-halo" aria-hidden="true"></span>
      <span class="orb-glow" aria-hidden="true"></span>
      <span class="orb-shell">
        <span class="orb-ring" aria-hidden="true"></span>
        <svg class="orb-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M15.5 9 22.5 21h-14z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
          <circle cx="32.5" cy="16" r="7" stroke="currentColor" stroke-width="2.6"/>
          <path d="m10.7 28.7 9.6 9.6m0-9.6-9.6 9.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <rect x="26.5" y="27.5" width="12" height="12" rx="2.6" stroke="currentColor" stroke-width="2.6"/>
        </svg>
      </span>
    </button>

    <section class="panel" role="dialog" aria-label="PlayStation 悬浮球菜单" hidden>
      <span class="panel-hair" aria-hidden="true"></span>
      <header class="panel-top">
        <span class="panel-brand">
          <span class="panel-mark">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M15.5 9 22.5 21h-14z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
              <circle cx="32.5" cy="16" r="7" stroke="currentColor" stroke-width="2.6"/>
              <path d="m10.7 28.7 9.6 9.6m0-9.6-9.6 9.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
              <rect x="26.5" y="27.5" width="12" height="12" rx="2.6" stroke="currentColor" stroke-width="2.6"/>
            </svg>
          </span>
          <span class="panel-brand-text"><b>PLAYSTATION</b><i>悬浮球</i></span>
        </span>
        <button class="panel-close" type="button" aria-label="收起悬浮球菜单">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="panel-status"><span class="status-dot" aria-hidden="true"></span><span class="panel-status-text">正在连接 Vnite…</span></div>

      <section class="hero" hidden>
        <div class="hero-art">
          <img class="hero-cover" alt="" draggable="false" />
          <span class="hero-fallback" aria-hidden="true">PS</span>
        </div>
        <div class="hero-info">
          <span class="hero-kicker">继续游玩 · CONTINUE</span>
          <h2 class="hero-title">—</h2>
          <p class="hero-meta">—</p>
        </div>
        <button class="hero-play" type="button" aria-label="继续游玩">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4v13.2L19 12z" fill="currentColor"/></svg>
        </button>
      </section>

      <div class="panel-empty" hidden>
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M15.5 9 22.5 21h-14z" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
          <circle cx="32.5" cy="16" r="7" stroke="currentColor" stroke-width="2.6"/>
          <path d="m10.7 28.7 9.6 9.6m0-9.6-9.6 9.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <rect x="26.5" y="27.5" width="12" height="12" rx="2.6" stroke="currentColor" stroke-width="2.6"/>
        </svg>
        <b>还没有游玩记录</b>
        <span>打开 Vnite 开始第一款游戏</span>
      </div>

      <div class="list-head"><span>最近游玩</span><i>RECENT</i></div>
      <ul class="list"></ul>

      <footer class="panel-foot">
        <button type="button" data-act="open">打开 Vnite</button>
        <button type="button" data-act="hide">隐藏悬浮球</button>
      </footer>

      <section class="settings">
        <div class="settings-top">
          <button class="settings-back" type="button" aria-label="返回最近游玩">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.6 3.2 4.8 8l4.8 4.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>返回</span>
          </button>
          <span class="settings-title">设置 · SETTINGS</span>
        </div>

        <div class="setting">
          <span class="setting-label">悬浮球大小</span>
          <div class="segmented" data-key="size">
            <button type="button" data-value="52">小</button>
            <button type="button" data-value="64">中</button>
            <button type="button" data-value="76">大</button>
          </div>
        </div>

        <div class="setting">
          <span class="setting-label">强调色</span>
          <div class="swatches" data-key="accent">
            <button type="button" data-value="blue" aria-label="蓝色"></button>
            <button type="button" data-value="violet" aria-label="紫色"></button>
            <button type="button" data-value="cyan" aria-label="青色"></button>
          </div>
        </div>

        <div class="setting">
          <span class="setting-label">界面音效</span>
          <button class="switch" type="button" data-key="sound" role="switch" aria-checked="true"><i></i></button>
        </div>

        <p class="settings-hint">大小、配色与音效会立即生效，并同步到 Vnite 插件设置。</p>
      </section>

      <div class="launch" hidden>
        <span class="launch-ring" aria-hidden="true"></span>
        <b>正在启动</b>
      </div>
    </section>
  </div>
  <script src="orb.js"></script>
</body>
</html>
