<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>伴学</title>
    <link rel="stylesheet" href="study.css" />
  </head>
  <body>
    <div class="card">
      <header class="card-head" id="head">
        <span class="badge">伴学</span>
        <span class="head-hint">离线分词 · 按住任意处拖动 / 右下角缩放</span>
        <span class="head-tools">
          <button class="tool" id="wordbookBtn" type="button">生词本</button>
          <button class="tool" id="historyBtn" type="button">历史</button>
        </span>
      </header>

      <div class="card-body" id="body">
        <section class="block">
          <h3>原文</h3>
          <p class="sentence" id="sentence"></p>
        </section>

        <section class="block">
          <h3>句节</h3>
          <ul class="chunks" id="chunks"></ul>
        </section>

        <section class="block">
          <h3>单词</h3>
          <ul class="words" id="words"></ul>
        </section>

        <section class="block" id="notesBlock" hidden>
          <h3>语法点</h3>
          <ul class="notes" id="notes"></ul>
        </section>

        <section class="block" id="transBlock" hidden>
          <h3>参考译文</h3>
          <p class="translation" id="translation"></p>
        </section>
      </div>

      <div class="word-detail" id="detail" hidden>
        <div class="detail-head">
          <span class="detail-word" id="detailWord"></span>
          <span class="detail-reading" id="detailReading"></span>
          <span class="detail-pos" id="detailPos"></span>
          <button class="detail-close" id="detailClose" type="button" aria-label="关闭">×</button>
        </div>
        <p class="detail-meaning" id="detailMeaning"></p>
      </div>

      <div class="drawer" id="drawer" hidden>
        <div class="drawer-head">
          <span class="drawer-title" id="drawerTitle">生词本</span>
          <span class="drawer-hint" id="drawerHint"></span>
          <button class="tool" id="drawerExport" type="button" hidden>导出 CSV</button>
          <button class="detail-close" id="drawerClose" type="button" aria-label="关闭">×</button>
        </div>
        <ul class="drawer-list" id="drawerList"></ul>
      </div>

      <div class="resize-grip" id="grip" title="拖动缩放"></div>
    </div>
    <script src="study.js"></script>
  </body>
</html>
